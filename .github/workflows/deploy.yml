name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; los push encolados se descartan salvo el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc corre dentro de `npm run build`: un error de tipos rompe el despliegue.
      #
      # La configuracion de Supabase se toma de .env.production, que esta en el
      # repositorio. NO declarar aqui VITE_SUPABASE_* desde secretos: Vite da
      # prioridad a las variables de entorno reales sobre los archivos .env, y un
      # secreto inexistente se expande a cadena vacia, con lo que pisaria la
      # configuracion buena y desplegaria la app sin conexion.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
